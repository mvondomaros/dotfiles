# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "ayu_light"

[palettes.ayu_light]
red = "#f07078"
orange = "#f19618"
yellow = "#f2ae49"
green = "#86b300"
teal = "#4cbe99"
cyan = "#41a6d9"
blue = "#399ee6"
purple = "#a37acc"
text = "#575f66"
muted = "#8a9199"
surface = "#f0ede4"
base = "#fafafa"

[battery]
disabled = true
