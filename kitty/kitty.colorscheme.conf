# The basic colors
foreground              #5b6673
background              #fafafa
selection_foreground    #fafafa
selection_background    #f0ede4

# Cursor colors
cursor                  #ff6900
cursor_text_color       #fafafa

# URL underline color when hovering with mouse
url_color               #41a6d9

# Kitty window border colors
active_border_color     #ff6900
inactive_border_color   #f0ede4
bell_border_color       #ff3333

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #fafafa
active_tab_background   #41a6d9
inactive_tab_foreground #5b6673
inactive_tab_background #f0ede4
tab_bar_background      #f0ede4

# Colors for marks (marked text in the terminal)
mark1_foreground #fafafa
mark1_background #41a6d9
mark2_foreground #fafafa
mark2_background #f07078
mark3_foreground #fafafa
mark3_background #4cbe99

