# Ayu Light, matched to the pinned neovim-ayu palette.
colourful: true

filekinds:
  normal: {foreground: "#5c6166"}
  directory: {foreground: "#4cbf99"}
  symlink: {foreground: "#399ee6"}
  pipe: {foreground: "#8a9199"}
  block_device: {foreground: "#e65050"}
  char_device: {foreground: "#e65050"}
  socket: {foreground: "#8a9199"}
  special: {foreground: "#a37acc"}
  executable: {foreground: "#86b300"}
  mount_point: {foreground: "#4cbf99"}

perms:
  user_read: {foreground: "#f07171", is_bold: true}
  user_write: {foreground: "#f2ae49", is_bold: true}
  user_execute_file: {foreground: "#86b300", is_bold: true}
  user_execute_other: {foreground: "#86b300", is_bold: true}
  group_read: {foreground: "#f07171"}
  group_write: {foreground: "#f2ae49"}
  group_execute: {foreground: "#86b300"}
  other_read: {foreground: "#f07171"}
  other_write: {foreground: "#f2ae49"}
  other_execute: {foreground: "#86b300"}
  special_user_file: {foreground: "#a37acc"}
  special_other: {foreground: "#abadb1"}
  attribute: {foreground: "#8a9199"}

size:
  major: {foreground: "#8a9199"}
  minor: {foreground: "#55b4d4"}
  number_byte: {foreground: "#8a9199"}
  number_kilo: {foreground: "#8a9199"}
  number_mega: {foreground: "#399ee6"}
  number_giga: {foreground: "#a37acc"}
  number_huge: {foreground: "#a37acc"}
  unit_byte: {foreground: "#8a9199"}
  unit_kilo: {foreground: "#55b4d4"}
  unit_mega: {foreground: "#a37acc"}
  unit_giga: {foreground: "#a37acc"}
  unit_huge: {foreground: "#4cbf99"}

users:
  user_you: {foreground: "#5c6166"}
  user_root: {foreground: "#f07171"}
  user_other: {foreground: "#e65050"}
  group_yours: {foreground: "#8a9199"}
  group_other: {foreground: "#8a9199"}
  group_root: {foreground: "#f07171"}

links:
  normal: {foreground: "#399ee6"}
  multi_link_file: {foreground: "#399ee6"}

git:
  new: {foreground: "#86b300"}
  modified: {foreground: "#f2ae49"}
  deleted: {foreground: "#e65050"}
  renamed: {foreground: "#4cbf99"}
  typechange: {foreground: "#c788ce"}
  ignored: {foreground: "#abadb1"}
  conflicted: {foreground: "#fa8d3e"}

git_repo:
  branch_main: {foreground: "#8a9199"}
  branch_other: {foreground: "#a37acc"}
  git_clean: {foreground: "#86b300"}
  git_dirty: {foreground: "#e65050"}

security_context:
  colon: {foreground: "#cccfd3"}
  user: {foreground: "#abadb1"}
  role: {foreground: "#a37acc"}
  typ: {foreground: "#d3d4d5"}
  range: {foreground: "#a37acc"}

file_type:
  image: {foreground: "#f2ae49"}
  video: {foreground: "#f07171"}
  music: {foreground: "#86b300"}
  lossless: {foreground: "#4cbf99"}
  crypto: {foreground: "#abadb1"}
  document: {foreground: "#5c6166"}
  compressed: {foreground: "#c788ce"}
  temp: {foreground: "#e65050"}
  compiled: {foreground: "#55b4d4"}
  source: {foreground: "#399ee6"}

punctuation: {foreground: "#cccfd3"}
date: {foreground: "#f2ae49"}
inode: {foreground: "#8a9199"}
blocks: {foreground: "#cccfd3"}
header: {foreground: "#5c6166"}
octal: {foreground: "#4cbf99"}
flags: {foreground: "#a37acc"}

symlink_path: {foreground: "#55b4d4"}
control_char: {foreground: "#55b4d4"}
broken_symlink: {foreground: "#f07171"}
broken_path_overlay: {foreground: "#d3d4d5"}

